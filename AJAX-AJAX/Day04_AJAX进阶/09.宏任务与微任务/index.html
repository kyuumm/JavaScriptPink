<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微任务与宏任务</title>
</head>

<body>
  <script>
    /**
     * 目标：阅读并回答打印的执行顺序
    */
    console.log(1)

    setTimeout(() => {
      console.log(2)
    }, 0)

    const p = new Promise((resolve, reject) => {
      // Promise任务本身是同步的，但是resolve异步
      console.log('3.5');//立刻打印

      //异步
      resolve(3)
    })

    p.then(res => {
      console.log(res)
    })

    console.log(4)
    //宏任务：浏览器环境执行的异步代码
    //微任务：JS引擎环境执行的异步代码

    /*
    浏览器：宏任务
    JS脚本(script)
    setTimeout/setInterval
    AJAX
    用户交互
    
    JS引擎：微任务
    Promise对象.then()

    微任务优先
    1  3.5  4  3  2
    */
  </script>
</body>

</html>
