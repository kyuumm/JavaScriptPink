<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件循环_练习</title>
</head>

<body>
  <script>
    /**
     * 目标：阅读并回答执行的顺序结果
    */
    console.log(1)

    setTimeout(() => {
      console.log(2)
    }, 0)

    //只是定义   
    function ajaxFn() {
      const xhr = new XMLHttpRequest()
      xhr.open('GET', 'http://hmajax.itheima.net/api/province')
      xhr.addEventListener('loadend', () => {
        console.log(4)
      })
      xhr.send()
    }

    //同步
    for (let i = 0; i < 1; i++) {
      console.log(5)
    }

    //调用栈找函数
    //进入ajaxFn，加载loadend是异步的，委托给宿主环境，
    ajaxFn()


    document.addEventListener('click', () => {
      console.log(6)
    })

    //同步执行函数
    myFn()

    //结束后从任务队列开始逐个执行
    //任务队列：setTimeout -> axios loadend事件监听
    function myFn() {
      console.log(3)
    }
  </script>
</body>

</html>
