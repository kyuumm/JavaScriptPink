<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件循环</title>
</head>

<body>

  <script>
    /**
     * 目标：阅读并回答执行的顺序结果
    */
    //js单线程，为了让耗时代码不阻塞其他代码运行，设计了事件循环模型
    console.log(1)

    setTimeout(() => {
      console.log(2)
    }, 0)

    console.log(3)

    setTimeout(() => {
      console.log(4)
    }, 2000)

    console.log(5)

    //调用栈，  宿主环境   ，       任务队列，
    //setTimeout 进入宿主环境，进入任务队列
    //遇到log ，进入调用栈，执行，出栈
    //当调用栈空闲时，反复去任务队列查看有无任务需要执行

    //什么是事件循环？是执行代码和收集异步代码任务，调用栈空闲，反复调用任务队列里回调函数执行机制
    //异步代码会交给宿主浏览器环境执行，异步有结果，回调函数放入任务队列排队，调用栈空闲，反复调用任务队列里的回调函数
  </script>
</body>

</html>
