    //数组遍历写法
    const cities = [
      { code: '110101' },
      { code: '310100' },
      { code: '440100' }
    ]

    const promiseList = cities.map(item => {
      return axios({
        url: 'http://hmajax.itheima.net/api/weather',
        params: { city: item.code }
      })
    })
    const p1 = Promise.all(promiseList)

    p1.then(result => {
      console.log(result);

      const htmlStr = result.map(item => {
        return `
        <li>${item.data.data.area}---${item.data.data.weather}</li>
        `
      }).join('')
      document.querySelector('.my-ul').innerHTML = htmlStr
      //是同时出来的
    }).catch(error => {
      console.log(error);

    })
  </script>
