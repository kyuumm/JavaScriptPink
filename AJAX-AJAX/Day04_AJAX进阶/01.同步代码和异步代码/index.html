<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同步代码和异步代码</title>
</head>

<body>
  <button class="btn">点我</button>
  <script>
    // 目标：阅读并回答代码执行和打印的顺序
    const result = 0 + 1

    console.log(result)
    setTimeout(() => {
      console.log(2)
    }, 2000)

    document.querySelector('.btn').addEventListener('click', () => {
      console.log(3)
    })

    document.body.style.backgroundColor = 'pink'
    console.log(4)
  </script>
</body>
<!-- 
1
4
2

同步代码：逐行执行，原地等待结果后，继续向下执行
异步代码：调用后好使，不阻塞代码，继续执行：setTimeout,setInterval,事件，AJAX，依靠回调函数接收

-->

</html>
