<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promise_链式调用</title>
</head>

<body>
  <script>
    /**
     * 目标：掌握Promise的链式调用
     * 需求：把省市的嵌套结构，改成链式调用的线性结构
    */
    const p1 = new Promise((resolve, reject) => {
      setTimeout(() => {
        resolve('北京市')
      }, 2000)
    })

    const p2 = p1.then(result => {
      console.log(result);
      //3创建promise对象，模拟city

      //return Promise 的结果会影响新的PRomise对象
      //新Promise函数的结果来自回调函数return的结果

      return new Promise((resolve, reject) => {
        setTimeout(() => {
          resolve(result + '--- 北京')
        })
      })
      //把p1的result通过函数返回值，返回的Promise中传递给下一个
    })

    p2.then(result => {
      console.log(result);
    })


  </script>
</body>

</html>
