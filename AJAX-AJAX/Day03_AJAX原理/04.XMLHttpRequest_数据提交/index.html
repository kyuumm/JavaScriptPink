<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMLHttpRequest_数据提交</title>
</head>

<body>
  <button class="reg-btn">注册用户</button>
  <script>
    /**
     * 目标：使用xhr进行数据提交-完成注册功能
    */
    document.querySelector('.reg-btn').addEventListener('click', () => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'http://hmajax.itheima.net/api/register')
      //注册事件监听
      xhr.addEventListener('loadend', () => {
        console.log(xhr.response)
      })
      //请求头设置
      //告诉服务器——我发过去的数据是 JSON 格式
      xhr.setRequestHeader('Content-Type', 'application/json');

      const data = { username: 'itheima010', password: '7654321' }
      const str = JSON.stringify(data);

      //xxx.toString():将值（数字，布尔值，数组）转换为字符串，如果是对象，转换结果是Object Object，数组的转换结果会带逗号分割

      //JSON.stringify(xxx):对象/数组转换为JSON格式的字符串
      //JSON.parse(xxx)将JSON字符串转为相对应的值
      console.log(str)
      xhr.send(str);
      //等待网络完成
      //请求完成后触发loadend内的回调函数
    })
  </script>
</body>

</html>
