<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认识Promise</title>
</head>

<body>
  <script>
    /**
     * 目标：使用Promise管理异步任务
    */
    //  axios 的底层就是 Promise + XHR
    //Promise：表示管理一个异步操作最终状态和结果值的对象
    //成功和失败，可以关联对应的处理程序
    const p = new Promise((resolve, reject) => {
      //执行异步代码
      setTimeout(() => {
        reject(new Error('模拟失败'))
        // resolve('模拟AJAX请求成功的结果')

      }, 2000)
    })
    p.then(result => {
      console.log(result);

    }).catch(error => {
      console.log(error);

    })
  </script>
</body>

</html>
