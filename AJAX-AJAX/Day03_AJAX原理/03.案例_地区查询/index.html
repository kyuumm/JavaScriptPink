<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案例_地区查询</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <style>
    :root {
      font-size: 15px;
    }

    body {
      padding-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <form id="editForm" class="row">
      <!-- 输入省份名字 -->
      <div class="mb-3 col">
        <label class="form-label">省份名字</label>
        <input type="text" value="北京" name="province" class="form-control province" placeholder="请输入省份名称" />
      </div>
      <!-- 输入城市名字 -->
      <div class="mb-3 col">
        <label class="form-label">城市名字</label>
        <input type="text" value="北京市" name="city" class="form-control city" placeholder="请输入城市名称" />
      </div>
    </form>
    <button type="button" class="btn btn-primary sel-btn">查询</button>
    <br><br>
    <p>地区列表: </p>
    <ul class="list-group">
      <!-- 示例地区 -->
      <li class="list-group-item">东城区</li>
    </ul>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    /**
     * 目标: 根据省份和城市名字, 查询对应的地区列表
    */
    document.querySelector('.sel-btn').addEventListener('click', () => {
      const pname = document.querySelector('.province').value;
      const cname = document.querySelector('.city').value;

      const qObj = {
        pname: pname,
        cname: cname
      }

      //URLSearchParams********************************************************
      //对象-》字符串
      const paramsObj = new URLSearchParams(qObj)//把对象转换成标准格式
      const queryString = paramsObj.toString()//转换成网址的参数字符串

      console.log(queryString)

      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'http://hmajax.itheima.net/api/area?' + queryString);

      xhr.addEventListener('loadend', () => {

        const data = JSON.parse(xhr.response)
        // const str = data.list.join('<br>')
        const htmlStr = data.list.map(areaName => {
          return `<li class="list-group-item">${areaName}</li>`
        }).join('')
        console.log(htmlStr)
        document.querySelector('.list-group-item').innerHTML = htmlStr;
        // const areaList = document.querySelector('.list-group-item').innerHTML = str;

      })
      xhr.send();

      //axios对比:
      /*      axios({
            url: 'http://hmajax.itheima.net/api/area',
            params: {
              pname: pName,
              cname: cName
            }
          }).then(result => {
            console.log(result.data.list);
            console.log(result.data.list.join('<br>'));
            let list = result.data.list;
    
            const str = list.map(areaName => `<li class="list-group-item">${areaName}</li>`).join('');
            //map复习：对数组里的每个数据处理，返回和原数组长度相同的数组
            console.log(str)
    
            document.querySelector('.list-group').innerHTML = str;
          })
    
      */
    })
  </script>
</body>

</html>
