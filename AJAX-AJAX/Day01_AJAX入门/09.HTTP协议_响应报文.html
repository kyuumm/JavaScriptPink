<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>09.HTTP协议_响应报文</title>
</head>

<body>
  <button class="btn">注册用户</button>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    /*
      注册用户: http://hmajax.itheima.net/api/register
      请求方法: POST
      参数名:
        username: 用户名 (中英文和数字组成, 最少8位)
        password: 密码 (最少6位)

      目标: 点击按钮, 通过axios提交用户和密码, 完成注册
      需求: 使用axios错误处理语法, 拿到报错信息, 弹框反馈给用户
    */
    //HTTP协议，规定了浏览器发送&服务器返回内容的格式，
    //  相应报文：服务器按照HTTP协议要求的格式，返回给浏览器的内容
    //和请求报文差不多的结构，响应行（协议，HTTP响应状态码，状态信息），响应头，空行响应体

    //1信息
    //2xx成功
    //4xx客户端错误（浏览器），404服务器找不到资源
    //f12中response是浏览器返回的内容， preview是格式化之后的结果
    document.querySelector('.btn').addEventListener('click', () => {
      axios({
        url: 'http://hmajax.itheima.net/api/registerr',
        method: 'post',
        data: {
          username: 'itheima007',
          password: '7654321'
        }
      }).then(result => {
        // 成功
        console.log(result)
      }).catch(error => {
        // 失败
        // 处理错误信息
        // console.log(error)
        console.log(error.response.data.message)
        // alert(error.response.data.message)
      })
    })
  </script>
</body>

</html>
