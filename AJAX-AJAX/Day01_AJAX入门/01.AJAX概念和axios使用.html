<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01.AJAX概念和axios使用</title>
</head>

<body>
    <p class="my-p"></p>
    <!-- 
        axios库地址: https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js
        省份数据地址: http://ajax-api.itheima.net/api/province
    -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script>
        axios({
            url: 'http://ajax-api.itheima.net/api/province'
        }).then(result => {
            console.log(result.data.data);
            console.log(result.data.data.join('<br>'));

            document.querySelector('.my-p').innerHTML = result.data.data.join('<br>');
        })
    </script>
</body>

</html>
